[project]
name = "name-audit"
version = "0.1.0"
description = "Does an LLM resume screener change its decision when only the name changes?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.0",
    "numpy>=2.5",
    "openai>=3.46",
]

[project.scripts]
name-audit = "name_audit.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/name_audit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
